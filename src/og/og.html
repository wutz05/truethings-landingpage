<!doctype html>
<!-- Template for the 1200 × 630 preview images (og:image). render-og.sh opens it
     once per entry in jobs.json: og.html?kicker=…&title=…&art=pair-in-love&lang=de -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #FFF5F1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(52% 70% at 82% 78%, rgba(255, 122, 102, .5) 0%, rgba(255, 122, 102, 0) 100%),
      radial-gradient(60% 50% at 100% 0%, rgba(196, 44, 104, .6) 0%, rgba(196, 44, 104, 0) 100%),
      radial-gradient(50% 60% at 0% 40%, rgba(255, 122, 102, .16) 0%, rgba(255, 122, 102, 0) 100%),
      linear-gradient(160deg, #380935 0%, #530F4E 42%, #7E1A5B 78%, #A82B62 100%);
  }
  .grain { position: absolute; inset: 0; background: url(../../assets/img/grain.webp) 0 0 / 200px 200px; opacity: .45; mix-blend-mode: soft-light; }
  .pix { position: absolute; image-rendering: pixelated; shape-rendering: crispEdges; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .kicker {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; margin-bottom: 30px;
    font-size: 21px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #FFE1D8;
    padding: 11px 22px 11px 14px; border-radius: 999px; background: rgba(255, 255, 255, .10);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .16);
  }
  .kicker img { width: 34px; height: 34px; border-radius: 9px; }
  h1 { font-size: 66px; line-height: 1.04; font-weight: 800; letter-spacing: -.034em; text-wrap: balance; }
  h1.long { font-size: 56px; }
  .brand { position: absolute; left: 72px; bottom: 50px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; color: rgba(255, 233, 228, .86); }
  .brand img { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .14); }
  .brand span { font-weight: 500; color: rgba(255, 233, 228, .6); }
  .art { position: absolute; right: 36px; bottom: 70px; width: 470px; image-rendering: pixelated; filter: drop-shadow(0 26px 30px rgba(34, 0, 24, .45)); }
  .art.single { width: 380px; right: 70px; bottom: 90px; }
  .marker { position: absolute; }
</style>
</head>
<body>
<div class="grain"></div>
<div id="deco"></div>
<div class="copy">
  <div class="kicker"><img src="../../assets/img/icon-96.png" alt=""><span id="kicker"></span></div>
  <h1 id="title"></h1>
</div>
<div class="brand"><img src="../../assets/img/icon-96.png" alt="">TrueThings <span>· truethingsapp.com</span></div>
<img class="art" id="art" alt="">
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('kicker').textContent = q.get('kicker') || '';
  const title = document.getElementById('title');
  title.textContent = q.get('title') || '';
  if (title.textContent.length > 34) title.classList.add('long');
  const art = q.get('art') || 'pair-in-love';
  const img = document.getElementById('art');
  img.src = '../../assets/img/things/' + art + '.png';
  if (!art.startsWith('pair-')) img.classList.add('single');

  const PIX = {
    heart: ['.XX.XX.', 'XwXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'],
    spark: ['...X...', '...X...', '..XwX..', 'XXXXXXX', '..XXX..', '...X...', '...X...'],
    plus: ['.X.', 'XwX', '.X.'],
    dot: ['X'],
  };
  function pix(kind, x, y, cell, color, opacity) {
    const rows = PIX[kind];
    let rects = '';
    rows.forEach((row, j) => [...row].forEach((c, i) => {
      if (c === 'X') rects += `<rect x="${i}" y="${j}" width="1.02" height="1.02"/>`;
      if (c === 'w') rects += `<rect x="${i}" y="${j}" width="1.02" height="1.02" fill="rgba(255,255,255,.65)"/>`;
    }));
    return `<svg class="pix" viewBox="0 0 ${rows[0].length} ${rows.length}" fill="${color}" style="left:${x}px;top:${y}px;width:${rows[0].length * cell}px;opacity:${opacity}">${rects}</svg>`;
  }
  document.getElementById('deco').innerHTML = [
    pix('heart', 1080, 58, 7, '#FF8FC0', .7), pix('spark', 760, 62, 6, '#FFD25E', .85), pix('plus', 640, 520, 7, '#FFE5DF', .45),
    pix('dot', 960, 40, 9, '#9CC8FF', .55), pix('heart', 820, 470, 5, '#FF5AB3', .55), pix('spark', 40, 40, 5, '#C9A8FF', .6),
    pix('plus', 1130, 380, 6, '#FF8A73', .5), pix('dot', 590, 90, 8, '#FF8A73', .45),
  ].join('');
</script>
</body>
</html>
